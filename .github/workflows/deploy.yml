# Verify Wonder production build on every push to main.
# Live hosting: private repo free plan cannot use GitHub Pages.
# Prefer continuous git push (agent handoff) + optional Vercel (see AGENTS.md).
name: Build Wonder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: wonder-dist
          path: dist
          retention-days: 14
